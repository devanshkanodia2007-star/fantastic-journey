<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Devansh</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="index.html" class="logo">
            ✦ DEVANSH
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html" class="active">
                Contact
            </a>

        </div>

    </nav>


    <!-- CONTACT -->

    <main class="contact-page">

        <section class="contact-intro">

            <p class="small-text">
                HAVE AN IDEA? ↗
            </p>

            <h1>
                LET'S<br>
                <span>CONNECT.</span>
            </h1>

            <p>
                Have a project idea?
                Want to collaborate?
                Or just want to say hello?
            </p>


            <div class="social-links">

                <a href="#">
                    GitHub ↗
                </a>

                <a href="#">
                    LinkedIn ↗
                </a>

                <a href="#">
                    Instagram ↗
                </a>

            </div>

        </section>


        <!-- FORM -->

        <form id="contactForm" class="contact-form">

            <label>
                NAME
            </label>

            <input
                type="text"
                placeholder="Your name"
                required
            >


            <label>
                EMAIL
            </label>

            <input
                type="email"
                placeholder="your@email.com"
                required
            >


            <label>
                MESSAGE
            </label>

            <textarea
                placeholder="Your message..."
                required
            ></textarea>


            <button
                type="submit"
                class="button yellow"
            >
                SEND MESSAGE →
            </button>

        </form>

    </main>


    <footer>
        THANKS FOR STOPPING BY ✦
    </footer>


    <script src="script.js"></script>

</body>
</html>
